name: Release

# Triggered only by pushing a version tag, which `npm run release` does for you:
#   npm run release          -> v1.0.1
#   npm run release minor    -> v1.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write       # to create the release and attach the installers

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel mid-publish

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests before building anything
        run: npm test

      # Writes src/main/baked-keys.js from repo secrets so the installed app
      # works with nothing but a resume and an email — see
      # scripts/write-baked-keys.mjs for exactly which secrets and why. The
      # file only ever exists here, on the runner, for this one build; it is
      # gitignored and never committed. Every BAKED_* secret is optional —
      # this step still succeeds, producing an app with no keys baked in,
      # same as before this existed.
      - name: Bake service keys into this build
        env:
          BAKED_GEMINI_API_KEY: ${{ secrets.BAKED_GEMINI_API_KEY }}
          BAKED_ANTHROPIC_API_KEY: ${{ secrets.BAKED_ANTHROPIC_API_KEY || vars.BAKED_ANTHROPIC_API_KEY }}
          BAKED_OPENROUTER_API_KEY: ${{ secrets.BAKED_OPENROUTER_API_KEY || vars.BAKED_OPENROUTER_API_KEY }}
          BAKED_GITHUB_PAT: ${{ secrets.BAKED_GITHUB_PAT }}
          BAKED_ADZUNA_APP_ID: ${{ secrets.BAKED_ADZUNA_APP_ID }}
          BAKED_ADZUNA_APP_KEY: ${{ secrets.BAKED_ADZUNA_APP_KEY }}
          BAKED_JOOBLE_API_KEY: ${{ secrets.BAKED_JOOBLE_API_KEY }}
          BAKED_JSEARCH_API_KEY: ${{ secrets.BAKED_JSEARCH_API_KEY }}
          BAKED_ACTIVEJOBSDB_API_KEY: ${{ secrets.BAKED_ACTIVEJOBSDB_API_KEY }}
          BAKED_YCJOBS_API_KEY: ${{ secrets.BAKED_YCJOBS_API_KEY }}
        run: node scripts/write-baked-keys.mjs

      # Built once, without publishing, so the privacy check happens before
      # anything can reach a public repository.
      #
      # Signed only when both secrets exist — CSC_LINK holds the self-signed
      # certificate's private key as a base64 data: URL (electron-builder
      # reads that form directly; scripts/create-signing-cert.ps1 writes one
      # alongside the .pfx for exactly this), CSC_KEY_PASSWORD its password.
      # A repository with neither secret set still builds — just unsigned,
      # same as before this existed.
      - name: Build the installer and the portable exe
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never

      - name: Refuse the build if it contains anything personal
        run: node scripts/check-build-privacy.mjs dist

      - name: Show what was built
        shell: bash
        run: ls -la dist/*.exe dist/*.yml

      # Only now, once the build is known to contain nothing personal, does it
      # go public. GITHUB_TOKEN is issued automatically for this run — there is
      # no secret to create, store, or rotate.
      - name: Publish the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Job Desk ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # latest.yml is what tells the installed app an update exists.
          # Without it, auto-update silently stops working.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

      # A fallback only for when publishing itself fails — on success the
      # build is already attached to the Release, so storing a second 200 MB
      # copy here would just burn artifact storage quota for nothing.
      - name: Keep the build artifacts if publishing failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.yml
          retention-days: 7
          if-no-files-found: warn
